# =============================================
# NutriTrack Backend - Application Configuration
# =============================================

# Server
server.port=8080

# ---- DEV: H2 In-Memory Database (active by default) ----
spring.datasource.url=jdbc:h2:mem:nutritrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- PROD: Switch to PostgreSQL (uncomment and fill in) ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/nutritrackdb
# spring.datasource.username=your_db_user
# spring.datasource.password=your_db_password
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.nutritrack=DEBUG
logging.level.org.springframework.web=INFO

# App name
spring.application.name=nutritrack-backend
